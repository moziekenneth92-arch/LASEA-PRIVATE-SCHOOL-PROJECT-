<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Academic Results</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="student-results-page" data-page="admin-academic-results">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand"><img class="brand-logo" src="logo-white.svg" alt="" /><span>Admin</span></div><button class="btn btn-secondary" type="button" data-mobile-menu>☰</button></div>
        <nav>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-students.html">Students</a>
          <a href="admin-teachers.html">Teachers</a>
          <a href="admin-classes.html">Classes</a>
          <a href="admin-subjects.html">Subjects</a>
          <a href="admin-cbt.html">CBT</a>
          <a class="active" href="admin-academic-results.html">Academic Results</a>
          <a href="admin-activities.html">Activities</a>
          <a href="admin-settings.html">Settings</a>
          <a href="index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1 class="page-title">Academic Results</h1>
          <div class="topbar-actions"><span class="user-chip">Admin</span><button class="btn btn-secondary" type="button" onclick="logout()">Logout</button></div>
        </header>

        <div class="content">
          <section class="filter-bar result-controls" aria-label="Result controls">
            <div class="result-control-fields">
              <div class="filter-group"><label for="adminResultClassFilter">Class</label><select id="adminResultClassFilter"></select></div>
              <div class="filter-group"><label for="adminResultStudentFilter">Student</label><select id="adminResultStudentFilter"></select></div>
              <div class="filter-group"><label for="adminResultTermFilter">Term</label><select id="adminResultTermFilter"></select></div>
              <div class="filter-group"><label for="adminResultSessionFilter">Session</label><select id="adminResultSessionFilter"></select></div>
            </div>
            <div class="result-actions">
              <button class="btn btn-secondary" id="downloadAdminResults" type="button">Download CSV</button>
              <button class="btn btn-primary" id="printAdminResults" type="button">Print / Save PDF</button>
            </div>
          </section>

          <article class="report-card" id="adminReportCard" aria-label="Student academic report card"></article>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
