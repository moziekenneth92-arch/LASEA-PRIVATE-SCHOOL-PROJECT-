<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Activities</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin-activities">
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand"><img class="brand-logo" src="logo-white.svg" alt="" /><span>Admin</span></div><button class="btn btn-secondary" type="button" data-mobile-menu>☰</button></div>
        <nav>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-students.html">Students</a>
          <a href="admin-teachers.html">Teachers</a>
          <a href="admin-classes.html">Classes</a>
          <a href="admin-subjects.html">Subjects</a>
          <a href="admin-cbt.html">CBT</a>
          <a href="admin-academic-results.html">Academic Results</a>
          <a class="active" href="admin-activities.html">Activities</a>
          <a href="admin-settings.html">Settings</a>
          <a href="index.html" onclick="logout()">Logout</a>
        </nav>
      </aside>
      <main class="main-panel">
        <header class="topbar"><h1 class="page-title">Activities</h1><div class="topbar-actions"><span class="user-chip">Admin</span><button class="btn btn-secondary" type="button" onclick="logout()">Logout</button></div></header>
        <div class="content">
          <section class="table-card">
            <div class="filter-bar">
              <div class="filter-group"><label>User</label><select><option>All</option></select></div>
              <div class="filter-group"><label>Role</label><select><option>All</option></select></div>
              <div class="filter-group"><label>Activity Type</label><select><option>All</option></select></div>
              <div class="filter-group"><label>Date</label><input type="date" /></div>
            </div>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>User</th><th>Role</th><th>Activity</th><th>Date</th><th>Time</th></tr></thead>
                <tbody id="adminActivityTable"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
